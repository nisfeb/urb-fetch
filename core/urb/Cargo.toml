[package]
name = "urb"
version = "0.0.1"
description = "urb-fetch's protocol logic on libmesa: nouns and codecs (M2)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mesa-sys = { path = "../mesa-sys" }
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }

[features]
# the native host (src/host): UDP, the relay, HTTPS, the stores
native = ["dep:ureq"]

[dev-dependencies]
urb-render = { path = "../urb-render" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[[test]]
name = "host"
required-features = ["native"]
