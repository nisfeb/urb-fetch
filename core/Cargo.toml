# The Rust core: see docs/rust-core.md.
[workspace]
resolver = "3"
members = ["mesa-sys", "urb", "urb-render", "urb-wasm", "render-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# the wasm modules the shims load (shim/build.sh): release, without the
# symbol names
[profile.wasm]
inherits = "release"
strip = true
